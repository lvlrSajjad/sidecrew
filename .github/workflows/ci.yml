# Fast set only. The slow tests (`*.slow.test.ts`) need mlx_lm, ~12 GB of weights and Apple silicon, so
# they stay a local gate — see CLAUDE.md. Nothing here downloads a model or starts a worker.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS because sidecrew is a macOS/Apple-silicon tool: `doctor` shells out to sysctl and vm_stat,
    # and `bench` to pmset and sw_vers. Running the suite anywhere else would be testing a machine we
    # do not ship to.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from `engines`, and current. A break on either is a break for somebody.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contracts:
    # Invariants that are cheap to check and expensive to notice late.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: package.json, server.json, plugin.json and the MCP server agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srvpkg=$(node -p "require('./server.json').packages[0].version")
          plg=$(node -p "require('./claude/.claude-plugin/plugin.json').version")
          # The fourth place, and the one nothing points at: the MCP server announces a version to
          # every client that connects. Only `test/mcp.test.ts` was holding it, and it caught a
          # release where the other three had moved and this had not.
          mcp=$(grep -oE 'SERVER_VERSION = "[^"]+"' src/mcp.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "package.json=$pkg server.json=$srv server.json/packages[0]=$srvpkg plugin.json=$plg mcp=$mcp"
          for v in "$srv" "$srvpkg" "$plg" "$mcp"; do
            [ "$v" = "$pkg" ] || { echo "::error::$v != $pkg — they move together (CLAUDE.md)"; exit 1; }
          done
      - name: server.json validates against the schema it pins
        # Against the registry's own schema, fetched from the URL server.json names, rather than against
        # a hand-written idea of it. Phase 7 found the file invalid in two independent ways — a 145-char
        # description against a 100 limit, and pre-2025-07 package keys (`registry_name`/`name` for
        # `registry_type`/`identifier`/`transport`) — either of which would have failed the publish.
        run: |
          url=$(node -p "require('./server.json').\$schema")
          echo "schema: $url"
          curl -sS --fail -m 30 "$url" -o /tmp/mcp-server.schema.json
          # --strict=false: the schema uses `example`, which is not a JSON Schema keyword and which ajv
          # refuses to see in strict mode. It is the registry's schema, not ours to clean up.
          npx -y ajv-cli@5 validate --spec=draft7 --strict=false -s /tmp/mcp-server.schema.json -d server.json
      - name: every shipped model is permissively licensed and pinned
        run: |
          node -e '
            const m = require("./src/models.json");
            const allowed = new Set(["Apache-2.0", "MIT"]);
            let bad = 0;
            for (const [key, e] of Object.entries(m.models)) {
              if (!allowed.has(e.licence)) { console.error(`::error::${key} is ${e.licence} — non-negotiable #6 allows only Apache-2.0 / MIT`); bad++; }
              if (!/^[0-9a-f]{7,64}$/.test(e.revision)) { console.error(`::error::${key} has no pinned revision — non-negotiable #4`); bad++; }
            }
            process.exit(bad ? 1 : 0);
          '
