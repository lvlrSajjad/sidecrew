# Publish a tagged version to npm and to the MCP Registry.
#
# Triggered by a `v*` tag and by nothing else. The first job is a gate rather than a step: every check
# in it is something that, if wrong, produces a published artefact that cannot be unpublished — npm
# forbids re-using a version number, and the registry resolves `io.github.lvlrSajjad/sidecrew` to
# whatever npm has. So the version agreement, the schema, the suite and the pack contents are all
# proved **before** anything leaves this machine.
#
# `ci.yml` already checks the three versions agree and validates `server.json`. It is repeated here on
# purpose: `ci.yml` runs on `main`, and a tag can point at a commit that never went through it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm and the MCP Registry both authenticate with a short-lived OIDC token rather than a stored
  # secret. **Neither needs a secret in this repository.** npm's half is Trusted Publishing, which is
  # configured once on npmjs.com against this repo and this workflow file — see the publish step.
  id-token: write

# One pin, read by the gate's pre-flight validate and by the registry publish. They have to be the
# same binary: a gate that validates with a different version than the one that publishes is not a
# gate. Bump it deliberately — `releases/latest` in a job holding `id-token: write` is a supply-chain
# exposure as well as a fragility.
env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  gate:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: the tag is the version, in all four places
        id: version
        # A tag that disagrees with package.json publishes the wrong number under the right name, and
        # there is no way back from that. Checked first because it is the one failure that cannot be
        # fixed by a second release.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srvpkg=$(node -p "require('./server.json').packages[0].version")
          plg=$(node -p "require('./claude/.claude-plugin/plugin.json').version")
          # The fourth place, and the one nothing points at: the MCP server announces a version to
          # every client that connects, and a client reads it to decide what it is talking to. Only
          # `test/mcp.test.ts` was holding this one, and it caught it.
          # Take the string literal whole. A `[0-9]+\.[0-9]+\.[0-9]+` match silently drops a
          # prerelease suffix, and it drops it on ONE side of the comparison: tagging v0.1.0 against
          # an mcp.ts still reading 0.1.0-rc.1 extracts 0.1.0 and **passes**, publishing a release
          # whose MCP server announces itself as a release candidate to every client that connects.
          # Found by the v0.1.0-rc.1 tag, which is what the rc was for.
          mcp=$(grep -oE 'SERVER_VERSION = "[^"]+"' src/mcp.ts | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag package.json=$pkg server.json=$srv server.json/packages[0]=$srvpkg plugin.json=$plg mcp=$mcp"
          for v in "$pkg" "$srv" "$srvpkg" "$plg" "$mcp"; do
            [ "$v" = "$tag" ] || { echo "::error::$v != $tag — the tag and all four move together (CLAUDE.md)"; exit 1; }
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: server.json validates against the schema it pins
        # The registry's own schema, fetched from the URL server.json names. Phase 7 found this file
        # invalid in two independent ways, either of which would have failed the publish.
        run: |
          url=$(node -p "require('./server.json').\$schema")
          curl -sS --fail -m 30 "$url" -o /tmp/mcp-server.schema.json
          npx -y ajv-cli@5 validate --spec=draft7 --strict=false -s /tmp/mcp-server.schema.json -d server.json

      - name: package.json claims the MCP name server.json publishes under
        # **The registry validates the published npm package, not just `server.json`.** It fetches the
        # tarball and refuses the publish unless `package.json` carries `mcpName` equal to the server
        # name — that is how it proves the person publishing the entry controls the npm package. Found
        # the hard way on `v0.1.1`: `mcp-publisher validate` passed, `login github-oidc` succeeded, and
        # `publish` returned 400 with the field named. `0.1.1` was already on npm by then, so the fix
        # cost a version.
        #
        # This one **is** a local copy of somebody else's rule, which ADR-0080 is otherwise against,
        # and it is here anyway because there is no pre-flight endpoint for it: the registry can only
        # answer once the package is published, which is after the point of no return. It catches the
        # omission, which is the failure mode that actually happened.
        run: |
          mcp=$(node -p "require('./package.json').mcpName ?? ''")
          srv=$(node -p "require('./server.json').name")
          echo "package.json mcpName=$mcp  server.json name=$srv"
          [ -n "$mcp" ] || { echo "::error::package.json has no mcpName — the registry will refuse the publish AFTER npm has taken the version"; exit 1; }
          [ "$mcp" = "$srv" ] || { echo "::error::mcpName ($mcp) != server.json name ($srv)"; exit 1; }

      - name: the registry itself accepts server.json
        # The step above validates the file against **the schema the file names**, which can only ever
        # catch invalidity and never staleness. `v0.1.0` passed it and was then rejected by the registry
        # with a 422: the file was pinned to the 2025-07-09 schema, whose package keys are snake_case,
        # while the API reads camelCase. The file validated against its own obsolescence. Phase 7 fixed
        # this same class of drift once already — the comment in `ci.yml` records it — which is what
        # makes it a check to add rather than a mistake to be more careful about.
        #
        # Worse, the registry job runs **after** npm by design, so the first thing to notice was an npm
        # version published and no registry entry, with no way back from either.
        #
        # `mcp-publisher validate` asks the live registry, which is the only authority on what it will
        # accept. It runs here so it is proved before anything leaves this machine. macOS/arm64 because
        # that is what this job runs on.
        run: |
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          if ! curl -fsSL "$BASE/mcp-publisher_darwin_arm64.tar.gz" | tar -xz mcp-publisher; then
            echo "::error::mcp-publisher ${MCP_PUBLISHER_VERSION} could not be fetched — see the registry job"
            exit 1
          fi
          chmod +x mcp-publisher
          ./mcp-publisher --version
          ./mcp-publisher validate

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: the tarball is dist, claude, README and LICENSE — and nothing else
        # `files` in package.json is the allowlist, and this is the assertion that it still is one.
        # A denylist that misses a blob has failed completely while appearing to work (ROADMAP
        # Priority 4), and a package published with a stray experiments/ directory in it has
        # distributed whatever was in that directory.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            const allowed = /^(dist\/|claude\/|README\.md$|LICENSE$|package\.json$)/;
            const stray = files.filter((f) => !allowed.test(f));
            if (stray.length) {
              for (const f of stray) console.error(`::error::${f} would be published and is not on the allowlist`);
              process.exit(1);
            }
            console.log(`${files.length} files, all on the allowlist`);
          '

      - name: doctor runs from the packed tarball, not from this checkout
        # `npm pack` proves what is in the tarball; this proves the tarball is a working install. The
        # two are different questions and only the second catches a missing runtime asset — the
        # prompt templates are copied into `dist` by a script, not by `tsc`.
        run: |
          tgz=$(npm pack --silent)
          tmp=$(mktemp -d)
          mv "$tgz" "$tmp/"
          cd "$tmp"
          npm init -y > /dev/null
          npm i --silent "./$tgz"
          # **`doctor` exits 1 on a machine that cannot host a worker, and a CI runner is one** —
          # 7 GB against ADR-0073's 24 GB floor. That is `doctor` being right, and it was the wrong
          # assertion for this step, which is about the *tarball*: that the install resolves, its code
          # loads, and the runtime assets `tsc` does not copy are present. `v0.1.0` failed here with
          # `0.1.0` already on npm, which is how this was found. Assert the tarball, not the runner.
          set +e
          out=$(./node_modules/.bin/sidecrew doctor --json 2>&1); code=$?
          set -e
          printf '%s\n' "$out"
          # 0 = supported machine, 1 = a fatal row (here: tier). Anything else is a crash.
          [ "$code" -le 1 ] || { echo "::error::doctor exited $code — that is a crash, not an unsupported machine"; exit 1; }
          printf '%s' "$out" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const j = JSON.parse(s);
              const names = new Set(j.checks.map(c => c.name));
              for (const need of ["platform", "node", "tier", "line-ranges", "tsconfig-include"]) {
                if (!names.has(need)) { console.error(`::error::doctor produced no \`${need}\` row — the install is not whole`); process.exit(1); }
              }
              console.log(`doctor ran from the tarball and reported ${j.checks.length} checks`);
            });
          '
          # The assets a script copies into `dist`, which `tsc` would not, and which nothing else here
          # would notice were missing until a run tried to render a prompt.
          for f in worker.md fixer.md retry.md fix-retry.md bench.md; do
            test -f "node_modules/sidecrew/dist/prompts/$f" \
              || { echo "::error::missing runtime asset dist/prompts/$f — the tarball is not a working install"; exit 1; }
          done
          echo "all five prompt templates present in the installed tarball"

  npm:
    needs: gate
    # **macOS, not ubuntu, and for the same reason `ci.yml`'s suite is macOS.** `prepublishOnly` is
    # `npm run build && npm test`, so `npm publish` runs the whole suite — and on `v0.1.0` that was the
    # first time the suite had ever run on Linux, where `test/cache.test.ts`'s "does not throw when it
    # cannot write" timed out. sidecrew is a macOS/Apple-silicon tool; a publish gated on a platform we
    # do not ship to is a gate on the wrong question.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      # setup-node cannot pin an npm version, so upgrade it here — to a RANGE, not to `@latest`.
      #
      # **Trusted Publishing needs npm >= 11.5.1** to recognise the OIDC environment, and the runner's
      # bundled npm is older than that. `@latest` would be a clock in the release pipeline instead of
      # a fix: simframe pinned Node 20, npm 12 shipped between two releases a day apart, required
      # Node >= 22, and the upgrade failed with EBADENGINE *before* the publish step — so a version
      # was tagged, released on GitHub, and **never published to npm**, with nothing warning. Node 22
      # above is load-bearing for the same reason.
      - name: upgrade npm for Trusted Publishing
        run: |
          npm install -g 'npm@>=11.5.1 <13'
          npm --version
      - run: npm ci
      - run: npm run build
      - name: publish to npm, with provenance
        # `--provenance` signs the package with this workflow's OIDC identity, so anybody can check
        # which commit and which workflow built what they installed. It is the cheapest thing this
        # repository can do about supply chain, and it costs a flag.
        #
        # **The dist-tag is chosen, not defaulted.** `npm publish` writes `latest` when no `--tag` is
        # given, *including for a prerelease* — so a `v0.1.0-rc.1` tag would have made `npm i
        # sidecrew` serve a release candidate to everybody. A prerelease goes to `next`; only a
        # release moves `latest`. The version's own shape decides, so nobody has to remember.
        #
        # **There is no token.** npm is ending token publishing, and Trusted Publishing authenticates
        # with this workflow's own OIDC identity — which cannot leak, expire or be copied, and needs
        # no 2FA bypass. It requires a one-time setup **on npmjs.com, not here**: Package → Settings
        # → Trusted Publisher → GitHub Actions, pointing at this repository and this workflow file.
        # Without that entry npm has nothing to trust and the publish fails `ENEEDAUTH`, which looks
        # exactly like a missing token and is not one.
        #
        # An already-published version is a **skip, not a failure**: publishing by hand and then
        # tagging is a normal thing to do, npm rejects a duplicate version, and that must not stop
        # the run before the registry step. Every other npm error still fails the job.
        run: |
          case "${{ needs.gate.outputs.version }}" in
            *-*) dist=next ;;   # any semver prerelease: 0.1.0-rc.1, 1.0.0-beta.2
            *)   dist=latest ;;
          esac
          echo "publishing ${{ needs.gate.outputs.version }} to dist-tag $dist"
          # **`npm publish ... | tee` hid every failure**, and this is how it was found. bash reports a
          # pipeline's status from its LAST command, and `tee` always succeeds — so the `if` took the
          # success branch unconditionally, the "already published" arm below was unreachable dead code,
          # and every other npm error printed "published" and passed the job green. `v0.1.0` left this
          # step with a ✓ having published nothing: `prepublishOnly` failed. Capture the status, then
          # branch on it.
          set +e
          npm publish --provenance --access public --tag "$dist" > /tmp/publish.log 2>&1
          rc=$?
          set -e
          cat /tmp/publish.log
          if [ "$rc" -eq 0 ]; then
            echo "published"
          elif grep -qiE 'cannot publish over|previously published|E403.*already' /tmp/publish.log; then
            echo "::notice::${{ needs.gate.outputs.version }} is already on npm — skipping, not failing"
          else
            echo "::error::npm publish failed for a reason that is not 'already published'"
            exit 1
          fi

  registry:
    # After npm, never beside it: the registry entry points at an npm version, and publishing the
    # pointer first makes it resolve to nothing for as long as npm takes.
    needs: [gate, npm]
    # **Releases only.** The registry entry is the thing clients resolve `io.github.lvlrSajjad/sidecrew`
    # to; it carries no dist-tag, so pointing it at a release candidate would hand every MCP client an
    # rc with no way to express "this one is provisional". A prerelease publishes to npm under `next`
    # and stops there.
    if: ${{ !contains(needs.gate.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: publish to the MCP Registry
        # `login github-oidc` exchanges this job's OIDC token for a registry credential, so there is
        # no secret to store or rotate. The namespace `io.github.lvlrSajjad/…` is what it proves the
        # right to publish under — it has to match `name` in server.json or the publish is rejected.
        #
        # **The publisher is pinned, not floated to `releases/latest`.** This binary is executed in a
        # job holding `id-token: write`, so "whatever they shipped this morning" is a supply-chain
        # exposure as well as a fragility. Bump it deliberately, and `validate` before `publish` so a
        # bad `server.json` fails before anything is claimed.
        run: |
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          if ! curl -fsSL "$BASE/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher; then
            echo "::error::mcp-publisher ${MCP_PUBLISHER_VERSION} could not be fetched. Check"
            echo "https://github.com/modelcontextprotocol/registry/releases and bump"
            echo "MCP_PUBLISHER_VERSION deliberately, rather than floating to latest."
            exit 1
          fi
          chmod +x mcp-publisher
          ./mcp-publisher --version
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
